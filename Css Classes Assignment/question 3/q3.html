<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="question3.css">
</head>
<body>

    <header>
        <h1>Image Showcase</h1>
    </header>

    <main class="gallery">

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?1" alt="Nature">
            </div>
            <figcaption>Beautiful Nature</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?2" alt="Mountain">
            </div>
            <figcaption>Mountain View</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?3" alt="City">
            </div>
            <figcaption>Modern City</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?4" alt="Forest">
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?5" alt="Ocean">
            </div>
            <figcaption>Ocean View</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/400/300?6" alt="Road">
            </div>
            <figcaption>Long Road</figcaption>
        </figure>

    </main>

</body>
</html>
