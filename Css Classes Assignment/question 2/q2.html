<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="./q2.css">
</head>
<body>

    <main class="tooltip-container">

        <div class="tooltip">
            Home

        <div class="tooltip">

            <span class="tooltip-text">View Profile</span>

        </div>

    </main>

</body>
</html>
