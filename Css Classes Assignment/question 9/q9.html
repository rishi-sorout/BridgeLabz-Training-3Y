<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="./q9.css">
</head>
<body>

    <main class="container">

        <h1>Combined CSS Effects</h1>

        <div class="effects">

            <button class="effect-btn blue">
                Hover Me
            </button>

            <button class="effect-btn green">
                Grow Me
            </button>

            <button class="effect-btn red">
                Click Me
            </button>

        </div>

    </main>

</body>
</html>
