<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <link rel="stylesheet" href="./q3.css">
</head>

<body>

    <header>
        <h1>CSS Gradient Showcase</h1>
    </header>

    <main>

        <section class="gradient linear">
            <div>
                <h2>Linear Gradient</h2>
                <p>A linear gradient changes color along a straight direction.</p>
            </div>
        </section>

        <section class="gradient radial">
            <div>
                <h2>Radial Gradient</h2>
                <p>A radial gradient spreads colors outward from a center point.</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Gradient Practice Page</p>
    </footer>

</body>
</html>
