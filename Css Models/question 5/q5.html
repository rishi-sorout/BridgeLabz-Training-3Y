<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="./q5.css">
</head>

<body>

    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>

    <main>
        <section class="content">

            <h2>Item List</h2>

            <ul class="items">
                <li>HTML</li>
                <li>CSS</li>
                <li>Flexbox</li>
                <li>Grid</li>
                <li>Responsive Design</li>
            </ul>

            <h2>Attribute Selectors</h2>

            <input type="text" placeholder="Text input">
            <input type="email" placeholder="Email input">

            <p>
                <a href="https://example.com">Secure HTTPS link</a>
            </p>

            <p>
                <a href="http://example.com">HTTP link</a>
            </p>

            <div class="parent">
                <p>Direct child paragraph</p>
                <p>Another paragraph</p>

                <span>
                    <p>Descendant paragraph</p>
                </span>
            </div>

        </section>
    </main>

    <footer>
        <p>Selector Demonstration</p>
    </footer>

</body>
</html>
