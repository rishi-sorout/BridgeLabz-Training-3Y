<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model Exploration</title>
    <link rel="stylesheet" href="./q8.css">
</head>

<body>

    <header>
        <h1>CSS Box Model Exploration</h1>
    </header>

    <main class="model-area">

        <section class="model">

            <div class="margin-layer">
                <div class="border-layer">
                    <div class="padding-layer">
                        <div class="content-layer">
                            CONTENT
                        </div>
                    </div>
                </div>
            </div>

            <p>
                <strong>Content:</strong> actual text or element content.
            </p>

            <p>
                <strong>Padding:</strong> space between content and border.
            </p>

            <p>
                <strong>Border:</strong> line surrounding padding and content.
            </p>

            <p>
                <strong>Margin:</strong> outside space separating elements.
            </p>

        </section>

        <section class="comparison">

            <h2>Box-Sizing Comparison</h2>

            <div class="default-box">
                Default: content-box
            </div>

            <div class="border-box">
                border-box
            </div>

        </section>

    </main>

    <footer>
        <p>Box Model Practice</p>
    </footer>

</body>
</html>
