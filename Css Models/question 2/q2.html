<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="./q2.css">
</head>

<body>

    <header>
        <h1>Height & Width Practice</h1>
    </header>

    <main class="layout">

        <section class="box box-one">
            <h2>Box 1</h2>
            <p>Width: 220px<br>Height: 150px</p>
        </section>

        <section class="box box-two">
            <h2>Box 2</h2>
            <p>Width: 30%<br>Height: 20vh</p>
        </section>

        <section class="box box-three">
            <h2>Box 3</h2>
            <p>Width: 18em<br>Height: 250px</p>
            <p class="long">
                This text demonstrates overflow behavior when content becomes larger than the available box.
            </p>
        </section>

    </main>

</body>
</html>
