
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
</head>
<body>

    <h1>Theme Switcher</h1>

    <p>Select your preferred theme.</p>

    <button class="themeButton" data-theme="light">

    <button class="themeButton" data-theme="dark">
        Dark
    </button>

    <button class="themeButton" data-theme="blue">
        Blue
    </button>

    <script src="themeSwitcher.js"></script>

</body>
</html>
