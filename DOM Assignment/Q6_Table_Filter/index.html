
<!DOCTYPE html>
<html lang="en">
<head>

    <title>Student Table Filter</title>

            <tr>

            </tr>

            <tr>
                <td>Rahul</td>
                <td>ECE</td>
                <td>7.5</td>
            </tr>

            <tr>
                <td>Vikas</td>
                <td>CSE</td>
                <td>9.0</td>
            </tr>

        </tbody>

    </table>

    <p id="noResults" hidden>No results found</p>

    <script src="liveTableFilter.js"></script>

</body>
</html>
