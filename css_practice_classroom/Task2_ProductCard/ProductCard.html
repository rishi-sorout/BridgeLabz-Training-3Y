<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Running Shoes</title>

    <link rel="stylesheet" href="./ProductCard.css">
</head>
<body>

    <div class="product-card">

        <div class="image-container">
            <img src="nike-shoes.avif" alt="Premium Running Shoes">

            <div class="discount">20% OFF</div>

            <button class="favorite">♡</button>
        </div>

        <div class="product-info">

            <div class="category">
                <b>SPORTS SHOES</b>
            </div>
    <br>
            <h2>Premium Running Shoes</h2>

            <div class="rating">
                <span class="stars">★ ★ ★ ★ ★</span>
                <span class="reviews">(120)</span>
            </div>

            <div class="price">
                <span class="current-price">₹1,999</span>
                <span class="old-price">₹2,499</span>
            </div>

            <button class="cart-button">Add to Cart</button>

        </div>

    </div>

</body>
</html>
